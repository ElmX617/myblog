baseURL = '/'
title = '我的生信学习笔记'
theme = 'PaperMod'

[params]
  env = 'development'
  title = '我的生信学习笔记'
  description = '记录 R 语言、生物信息学、单细胞 RNA-seq、代谢组学与科研学习。'
  author = '你的名字'

  defaultTheme = 'auto'
  disableThemeToggle = false

  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowBreadCrumbs = true
  ShowToc = true
  TocOpen = false

[params.assets]
  favicon = "/favicon.ico"
  favicon16x16 = "/favicon.ico"
  favicon32x32 = "/favicon.ico"
  apple_touch_icon = "/favicon.ico"

[params.profileMode]
  enabled = true
  title = '我的生信学习笔记'
  subtitle = 'R · Bioinformatics · scRNA-seq'
  imageUrl = 'dog1.jpg'
  imageTitle = '我的头像'
  imageWidth = 225
  imageHeight = 225

[params.homeInfoParams]
  Title = '🧬 我的生信学习笔记'
  Content = '''
从 R 语言开始，记录我的生物信息学学习之路。

📊 R语言  
